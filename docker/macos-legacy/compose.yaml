services:
  mujoco-mac-legacy:
    platform: linux/amd64
    build:
      context: .
    image: ros2-mujoco:mac-legacy-202602
    ports:
      - "127.0.0.1:6001:5900"
      - "127.0.0.1:6080:6080"
    volumes:
      - "${MUJOCO_WORKSPACE:?Set MUJOCO_WORKSPACE to an absolute source directory}:/workspace"

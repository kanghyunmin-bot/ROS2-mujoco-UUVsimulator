services:
  ardusub-sitl:
    build:
      context: ../..
      dockerfile: docker/ardusub/Dockerfile
    image: uuv-sim-ardusub-sitl:local
    container_name: uuv-ardusub-sitl
    init: true
    working_dir: /workspace
    volumes:
      - ../..:/workspace
      - ardupilot-build:/workspace/ardupilot/build
      - ardupilot-ccache:/home/ardupilot/.ccache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKSPACE_DIR: /workspace
      ARDUPILOT_DIR: /workspace/ardupilot
      SITL_DIRECT_MAVLINK: "0"
      SITL_FORCE_NO_DISPLAY: "1"
      SITL_USE_REAL_PARAM_FILE: "1"
      SITL_REAL_PARAM_FILE: /workspace/real_robot.param
      SITL_EKF3_EXTNAV: ${SITL_EKF3_EXTNAV:-0}
      SITL_AHRS_EKF_TYPE: ${SITL_AHRS_EKF_TYPE:-3}
      SITL_JSON_HOST: host.docker.internal
      SITL_JSON_SENSOR_PORT: "9003"
      SITL_JSON_SERVO_PORT: "9002"
      SITL_SERIAL0_UDPCLIENT: "0"
      SITL_CONSOLE_HOST: host.docker.internal
      SITL_CONSOLE_PORT: "14552"
      SITL_QGC_HOST: host.docker.internal
      SITL_QGC_PORT: "14550"
      SITL_MAVROS_HOST: host.docker.internal
      SITL_MAVROS_PORT: "14551"
      SITL_MUJOCO_MAV_HOST: host.docker.internal
      SITL_MUJOCO_MAV_PORT: "14660"
      SITL_QGC_OUTPUT_ENABLE: "0"
      SITL_QGC_DIRECT_SERIAL_ENABLE: "0"
      SITL_MAVROS_OUTPUT_ENABLE: "0"
      SITL_DEDICATED_COMMAND_MAVLINK: "0"
    restart: "no"

volumes:
  ardupilot-build:
  ardupilot-ccache:

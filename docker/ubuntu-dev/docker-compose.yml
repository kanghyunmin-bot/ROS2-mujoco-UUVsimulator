services:
  uuv-dev:
    build:
      context: ../..
      dockerfile: docker/ubuntu-dev/Dockerfile
    image: khm/ros2-mujoco-uuv:dev
    init: true
    working_dir: /workspace
    network_mode: host
    ipc: host
    gpus: all
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.docker.xauth
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RCUTILS_COLORIZED_OUTPUT: "1"
      UUV_THRUSTER_BUS_VOLTAGE_V: ${UUV_THRUSTER_BUS_VOLTAGE_V:-}
      UUV_THRUSTER_VOLTAGE_TRACE: ${UUV_THRUSTER_VOLTAGE_TRACE:-}
    volumes:
      - ../..:/workspace
      - ${UUV_XAUTHORITY:-/dev/null}:/tmp/.docker.xauth:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - uuv-ardupilot-build:/workspace/ardupilot/build
      - uuv-ccache:/home/robot/.ccache
    stop_grace_period: 20s

volumes:
  uuv-ardupilot-build:
  uuv-ccache:

vla_data_collector:
  ros__parameters:
    dataset_root: ~/vla_data/staging
    record_rate_hz: 10.0
    max_sensor_age_sec: 0.25
    max_control_age_sec: 0.5
    jpeg_quality: 95
    default_task: ""

    ego_image_topic: /imx219/camera0/image_raw/compressed
    buoy_release_image_topic: /imx219/camera1/image_raw/compressed
    dvl_twist_topic: /dvl/twist
    dvl_data_topic: /dvl/data
    imu_topic: /mavros/imu/data
    depth_topic: /depth/pose
    rc_override_topic: /mavros/rc/override
    task_description_topic: /vla/task_description

    # ArduSub channel numbers in [surge, sway, heave, yaw] order.
    action_channels: [5, 6, 3, 4]
    neutral_pwm: 1500
    pwm_span: 300
    depth_pose_z_is_positive_up: true

    body_frame: base_link
    dvl_input_frame: dvl_link
    dvl_convention: FRD

    # Explicitly change to task_demonstration for armed, reviewed demonstrations.
    collection_kind: connection_check
    data_source: unknown  # real or simulation; never inferred from topic names
    session_id: ""
    provenance_file: ""
    expected_mode: STABILIZE

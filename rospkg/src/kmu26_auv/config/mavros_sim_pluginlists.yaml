/**:
  ros__parameters:
    # Minimal MAVROS surface required by the MuJoCo/SITL GUI, pinger homing,
    # and RC-driven mission controllers.  Real-vehicle launches continue to
    # use MAVROS' complete ArduPilot plugin list.
    plugin_allowlist:
      - command
      - imu
      - local_position
      - manual_control
      - rc_io
      - sys_status
      - sys_time
      - vfr_hud

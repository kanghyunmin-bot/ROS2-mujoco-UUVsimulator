name: Source checks
on: [push, pull_request]
jobs:
  physics-contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install mujoco==3.8.0 numpy scipy pytest pillow opencv-python-headless pyyaml
      - run: python uuv_mujoco/current/tools/check_research_pool_scene.py
      - run: python uuv_mujoco/current/tools/check_rope_fluid_ownership.py
      - run: python -m pytest -q uuv_mujoco/current/tools/test_hydrodynamic_batch_sampling.py uuv_mujoco/current/tools/test_vla_camera_intrinsics.py uuv_mujoco/current/tools/test_research_pool_layout.py uuv_mujoco/current/tools/test_sitl_heartbeat_state_recording.py

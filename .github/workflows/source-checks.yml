name: Source checks
on: [push, pull_request]
jobs:
  physics-contracts:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        mujoco: ['3.8.0', '3.12.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install mujoco==${{ matrix.mujoco }} numpy scipy pytest pillow opencv-python-headless pyyaml
      - run: python uuv_mujoco/current/tools/check_research_pool_scene.py
      - run: python uuv_mujoco/current/tools/check_rope_fluid_ownership.py
      - run: python uuv_mujoco/current/tools/check_rake_pvc_impacts.py
      - run: python uuv_mujoco/current/tools/check_attached_buoy_impacts.py
      - run: python -m pytest -q uuv_mujoco/current/tools/test_contact_timestep.py
      - run: python -m pytest -q uuv_mujoco/current/tools/test_startup_alignment.py
      - run: python -m pytest -q uuv_mujoco/current/tools/test_hydrodynamic_batch_sampling.py uuv_mujoco/current/tools/test_vla_camera_intrinsics.py uuv_mujoco/current/tools/test_research_pool_layout.py uuv_mujoco/current/tools/test_sitl_heartbeat_state_recording.py
      - name: Camera optics and capture timing
        run: >-
          python -m pytest -q
          uuv_mujoco/current/tools/test_underwater_camera_sensor_model.py
          uuv_mujoco/current/tools/test_underwater_camera_render.py
          uuv_mujoco/current/tools/test_water_lighting.py
          uuv_mujoco/current/tools/test_camera_sensor_runtime.py
          uuv_mujoco/current/tools/test_camera_publish_integration.py
          uuv_mujoco/current/tools/test_mavproxy_stream_ownership.py
      - name: Browser preview and missing sensor values
        run: |
          node uuv_mujoco/current/tools/test_web_sensor_display.cjs
          node uuv_mujoco/current/tools/test_web_camera_preview.cjs

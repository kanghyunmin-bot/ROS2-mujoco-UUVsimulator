<!doctype html><html lang="ko"><meta charset="utf-8"><title>FSM 자동 수집 검증</title>
<style>body{font:18px system-ui;background:#101b2b;color:#edf5ff;max-width:960px;margin:60px auto;padding:24px}h1{font-size:32px}.card{padding:24px;background:#1b2b41;border-radius:16px;margin:20px 0}td,th{padding:14px;text-align:left}small{color:#aabbcf}</style>
<h1>FSM 자동 수집 검증</h1><small>전방 영상으로 조종 · 전방/손 영상 기록 · 실제 포크 접촉과 고정 해제 여부로 결과 기록</small>
<div id="status" class="card">상태 불러오는 중…</div><table><thead><tr><th>회차</th><th>결과</th><th>프레임</th><th>초기화</th><th>종료 사유</th></tr></thead><tbody id="rows"></tbody></table>
<script>async function refresh(){try{let s=await(await fetch('status.json',{cache:'no-store'})).json();document.getElementById('status').textContent=`${s.phase} · ${s.results.length}/${s.episodes}회 저장 ${s.fsm?'· '+s.fsm:''} ${s.sim_seconds?'· '+s.sim_seconds.toFixed(1)+'초':''} ${s.error||''}`;let rows=document.getElementById('rows');rows.replaceChildren();for(let r of s.results){let tr=document.createElement('tr');for(let v of [r.trial,r.success?'성공':'실패',r.saved.frames,r.reset_verified?'확인':'확인 중',r.reason]){let td=document.createElement('td');td.textContent=v;tr.append(td)}rows.append(tr)}}catch(e){document.getElementById('status').textContent='상태 파일 대기 중'}}refresh();setInterval(refresh,2000)</script></html>
